<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dialer — Agent</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="topbar">
    <h1>VA Power Dialer</h1>
    <div class="user-info">
      <span id="me-label"></span>
      <a id="admin-link" href="/admin.html" hidden>Admin Dashboard</a>
      <button id="logout-btn" class="ghost">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="button-group">
        <div class="button-group-label">Channel</div>
        <div class="controls-row">
          <select id="channel-select">
            <option value="browser">Browser (WebRTC)</option>
            <option value="phone" id="channel-phone-option" hidden>Call My Phone</option>
            <option value="vapi" id="channel-vapi-option" hidden>AI Assistant</option>
          </select>
          <span id="device-status" class="status-line"></span>
        </div>
      </div>
      <div class="button-group">
        <div class="button-group-label">Session</div>
        <div class="controls-row">
          <button id="start-autodial-btn" class="primary">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Start Auto-Dial
          </button>
          <button id="pause-queue-btn" class="warn" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            Pause Queue
          </button>
          <button id="next-lead-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            Next Lead
          </button>
        </div>
      </div>
    </div>

    <div class="grid-3">
      <div class="card lead-panel">
        <h2>Current Lead</h2>
        <div id="lead-empty" class="hint">No lead loaded. Click &ldquo;Next Lead&rdquo; or &ldquo;Start Auto-Dial&rdquo;.</div>

        <div id="lead-details" hidden>
          <div class="lead-header">
            <div class="lead-avatar" id="lead-avatar">—</div>
            <div class="lead-heading">
              <div class="lead-name" id="lead-name"></div>
              <div class="lead-company" id="lead-company"></div>
            </div>
          </div>

          <div class="lead-phone-row">
            <span class="phone-number" id="lead-phone"></span>
            <span class="phase-pill phase-idle" id="phase-pill">
              <span class="phase-dot"></span>
              <span id="phase-label">Idle</span>
              <span class="call-timer" id="call-timer" hidden>00:00</span>
            </span>
          </div>

          <div class="field-grid">
            <div class="field"><div class="k">Category</div><div class="v" id="lead-category"></div></div>
            <div class="field"><div class="k">Address</div><div class="v" id="lead-address"></div></div>
            <div class="field"><div class="k">Website</div><div class="v" id="lead-website"></div></div>
            <div class="field"><div class="k">Email</div><div class="v" id="lead-email"></div></div>
            <div class="field"><div class="k">Rating / Reviews</div><div class="v" id="lead-rating"></div></div>
            <div class="field"><div class="k">Latest Review</div><div class="v" id="lead-latest-review"></div></div>
            <div class="field"><div class="k">Unclaimed Listing</div><div class="v" id="lead-unclaimed"></div></div>
            <div class="field"><div class="k">Assistant</div><div class="v" id="lead-assistant"></div></div>
            <div class="field full"><div class="k">Links</div><div class="v" id="lead-links"></div></div>
            <div class="field full"><div class="k">Notes</div><div class="v" id="lead-notes"></div></div>
          </div>

          <div id="call-idle-actions">
            <button id="call-btn" class="primary lg">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Call
            </button>
          </div>

          <div id="call-active-actions" class="button-group" hidden>
            <div class="button-group-label">Call</div>
            <div class="controls-row">
              <button id="mute-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                Mute
              </button>
              <button id="hangup-btn" class="danger">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                Hangup
              </button>
            </div>
          </div>

          <div id="transfer-group" class="button-group" hidden>
            <div class="button-group-label">Warm Transfer</div>
            <div class="controls-row">
              <button id="transfer-btn" class="warn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Start Transfer
              </button>
              <button id="hold-btn" hidden>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                Hold Lead
              </button>
              <button id="complete-transfer-btn" class="success" hidden>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Complete Transfer
              </button>
            </div>
          </div>

          <div id="call-status" class="status-line"></div>

          <hr class="section-divider" />
          <h2>Outcome</h2>
          <form id="outcome-form">
            <input type="hidden" id="outcome-call-log-id" />
            <div class="form-grid">
              <div>
                <label>Contact Person</label>
                <input id="outcome-contact-person" />
              </div>
              <div>
                <label>Contact Title</label>
                <input id="outcome-contact-title" />
              </div>
              <div>
                <label>Email</label>
                <input id="outcome-email" type="email" />
              </div>
              <div>
                <label>Callback Appointment</label>
                <input id="outcome-callback-appt" type="datetime-local" />
              </div>
              <div class="full">
                <label>Call Outcome</label>
                <select id="outcome-value" required>
                  <option value="">Select…</option>
                  <option>Answered</option>
                  <option>No Answer</option>
                  <option>Left Voicemail</option>
                  <option>Interested/Transferred</option>
                  <option>Do Not Call</option>
                </select>
              </div>
              <div class="full">
                <label>Notes</label>
                <textarea id="outcome-notes" rows="4"></textarea>
              </div>
            </div>
            <div class="controls-row">
              <button type="submit" class="primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Save &amp; Next
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="controls-row" style="justify-content:space-between; margin:0 0 12px">
          <h2 style="margin:0">Queue</h2>
          <span class="queue-count" id="queue-count">0</span>
        </div>
        <div id="queue-list" class="queue-list"></div>
      </div>
    </div>
  </div>

  <script src="/vendor/twilio.js"></script>
  <script type="module" src="/js/agent.js"></script>
</body>
</html>
